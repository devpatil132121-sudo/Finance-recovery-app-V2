<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dev Finance Collection</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f2f5f9;
color:#222
}

header{
background:#123b68;
color:white;
padding:18px;
text-align:center
}

header h2{margin:0 0 5px}

.container{
padding:15px;
max-width:700px;
margin:auto
}

.card{
background:white;
padding:16px;
margin:12px 0;
border-radius:14px;
box-shadow:0 3px 10px #0001
}

button{
border:0;
border-radius:10px;
padding:13px 16px;
margin:5px 2px;
font-size:15px;
cursor:pointer;
background:#123b68;
color:white
}

button.green{background:#198754}
button.orange{background:#f08c00}
button.red{background:#dc3545}

input,select,textarea{

.option{
display:grid;

}

background:#eef5ff;

margin-top:10px;

}

.scanbox{

border-radius:10px;
margin-top:10px

.small{

}

hr{
border:0;
border-top:1px solid #ddd;
margin:15px 0

border:1px solid #ddd;
padding:12px;

}

display:none
}

.loading{
text-align:center;
padding:20px
}
</style>
</head>

<body>

<header>
<h2>DEV FINANCE COLLECTION</h2>
<div>Customer & Vehicle Management</div>
</header>

<div class="container">

<!-- SEARCH -->

<div class="card">

<h3>🔎 Smart Customer / Vehicle Search</h3>

<input
id="searchBox"
placeholder="Customer name / Vehicle number / Mobile"
oninput="searchCustomer()"
>

<div id="searchResult"></div>

</div>


<!-- SCAN -->

<div class="card">

<h3>📷 Customer List / Document Scanner</h3>

<div class="option">

<button onclick="startCamera()">
📷 Camera
</button>

<button onclick="scanFromGallery()">
🖼️ Gallery
</button>

</div>

<button
class="orange"
onclick="scanDocument()"
style="width:100%"
>
📄 Upload Customer List / Document
</button>

<div class="small">
Photo किंवा document मधील customer details OCR ने वाचून
save करण्यासाठी.
</div>

<div id="ocrStatus"></div>

<div id="ocrResults"></div>

</div>


<!-- ADD CUSTOMER -->

<div class="card">

<h3>➕ Add Customer / Vehicle</h3>

<input
id="customerName"
placeholder="Customer Name"
>

<input
id="vehicleNumber"
placeholder="Vehicle Number"
>

<input
id="mobile"
placeholder="Mobile Number"
type="tel"
>

<input
id="pending"
placeholder="Pending Amount"
type="number"
>

<input
id="dueDate"
placeholder="Due Date"
type="date"
>

<input
id="agreement"
placeholder="Agreement / Loan Number"
>

<textarea
id="address"
placeholder="Address"
></textarea>

<select id="status">

<option value="Pending">Pending</option>
<option value="Promise">Payment Promise</option>
<option value="Paid">Paid</option>
<option value="Vehicle">Vehicle Handover</option>

</select>

<button
class="green"
onclick="addCustomer()"
>
Save Customer
</button>

</div>


<!-- PAYMENT -->

<div class="card">

<h3>💰 Collection Entry</h3>

<input
id="paymentCustomer"
placeholder="Customer Name"
>

<input
id="paymentAmount"
placeholder="Payment Amount"
type="number"
>

<input
id="paymentDate"
type="date"
>

<button
class="green"
onclick="savePayment()"
>
Save Payment
</button>

<div id="paymentMessage"></div>

</div>


<!-- CUSTOMER LIST -->

<div class="card">

<h3>📋 Customer List</h3>

<div id="customerList"></div>

</div>

</div>


<script>

/* =====================================================
   DATA
===================================================== */

let customers =
JSON.parse(localStorage.getItem("devCustomers")) || [];


/* =====================================================
   SAVE DATA
===================================================== */

function saveData(){

localStorage.setItem(
"devCustomers",
JSON.stringify(customers)
);

}


/* =====================================================
   SAFE HTML
===================================================== */

function safe(text){

return String(text || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
   NORMALIZE VEHICLE
===================================================== */

function normalizeVehicle(text){

return (text || "")
.toUpperCase()
.replace(/[^A-Z0-9]/g,"");

}


/* =====================================================
   VEHICLE SIMILARITY
===================================================== */

function vehicleSimilarity(a,b){

a=normalizeVehicle(a);
b=normalizeVehicle(b);

if(!a || !b)return 0;

let maxLen=Math.max(a.length,b.length);
let minLen=Math.min(a.length,b.length);

let same=0;

for(let i=0;i<minLen;i++){

if(a[i]===b[i])same++;

}

return Math.round((same/maxLen)*100);

}


/* =====================================================
   SMART SEARCH
===================================================== */

function searchCustomer(){

let q=document
.getElementById("searchBox")
.value
.trim();

let box=document
.getElementById("searchResult");

if(!q){

box.innerHTML="";
return;

}

let lower=q.toLowerCase();
let vehicle=normalizeVehicle(q);

let exact=customers.filter(c=>{

return(
(c.name || "").toLowerCase().includes(lower) ||
normalizeVehicle(c.vehicle).includes(vehicle) ||
(c.mobile || "").includes(q) ||
(c.agreement || "").toLowerCase().includes(lower)
);

});


if(exact.length){

box.innerHTML=exact.map(c=>`

<div class="result">

<b>👤 ${safe(c.name || "-")}</b>

<br>🚗 Vehicle:
${safe(c.vehicle || "-")}

<br>📱 Mobile:
${safe(c.mobile || "-")}

<br>💰 Pending:
₹${safe(c.pending || "0")}

<br>📅 Due:
${safe(c.dueDate || "-")}

<br>📄 Agreement:
${safe(c.agreement || "-")}

<br>📌 Status:
${safe(c.status || "-")}

<br><br>

<button
class="green"
onclick="paymentFor('${encodeURIComponent(c.name || "")}')"
>
💰 Payment
</button>

</div>

`).join("");

return;

}


/* SMART VEHICLE MATCH */

let smart=customers
.map(c=>({

customer:c,

score:vehicleSimilarity(
vehicle,
c.vehicle
)

}))
.filter(x=>x.score>=60)
.sort((a,b)=>b.score-a.score)
.slice(0,5);


if(smart.length){

box.innerHTML=`

<div class="result">
🔎 <b>Smart Match</b>
<br>
Exact match सापडला नाही.
</div>
`;

smart.forEach(x=>{

box.innerHTML+=`

<div class="result">

🚗 <b>${safe(x.customer.vehicle || "-")}</b>

<br>👤 ${safe(x.customer.name || "-")}

<br>📱 ${safe(x.customer.mobile || "-")}

<br>💰 ₹${safe(x.customer.pending || "0")}

<br>📊 Match: ${x.score}%

<button
onclick="selectCustomer('${encodeURIComponent(x.customer.vehicle || "")}')"
>
Select
</button>

</div>

`;

});

return;

}


box.innerHTML=`

<div class="result">

❌ Customer / Vehicle सापडला नाही.

<br><br>

<button onclick="useVehicle('${encodeURIComponent(q)}')">
➕ New Customer Add करा
</button>

</div>

`;

}


/* =====================================================
   SELECT CUSTOMER
===================================================== */

function selectCustomer(vehicle){

vehicle=decodeURIComponent(vehicle);

let c=customers.find(
x=>x.vehicle===vehicle
);

if(!c)return;

document.getElementById("searchBox").value=c.vehicle;

document.getElementById("searchResult").innerHTML=`

<div class="result">

<b>✅ Customer Found</b>

<hr>

👤 ${safe(c.name || "-")}

<br>🚗 ${safe(c.vehicle || "-")}

<br>📱 ${safe(c.mobile || "-")}

<br>💰 ₹${safe(c.pending || "0")}

<br>📅 ${safe(c.dueDate || "-")}

<br>📄 ${safe(c.agreement || "-")}

<br>📌 ${safe(c.status || "-")}

<br><br>

<button
class="green"
onclick="paymentFor('${encodeURIComponent(c.name || "")}')"
>
💰 Add Payment
</button>

</div>

`;

}


/* =====================================================
   CAMERA
===================================================== */

function startCamera(){

let input=document.createElement("input");

input.type="file";
input.accept="image/*";
input.capture="environment";

input.onchange=function(){

if(input.files && input.files.length){

runOCR(input.files[0]);

}

};

input.click();

}


/* =====================================================
   GALLERY
===================================================== */

function scanFromGallery(){

let input=document.createElement("input");

input.type="file";
input.accept="image/*";

input.onchange=function(){

if(input.files && input.files.length){

runOCR(input.files[0]);

}

};

input.click();

}


/* =====================================================
   DOCUMENT UPLOAD
===================================================== */

function scanDocument(){

let input=document.createElement("input");

input.type="file";

input.accept=
"image/*,.pdf,.txt,.csv";

input.onchange=function(){

if(input.files && input.files.length){

let file=input.files[0];

if(file.type==="application/pdf"){

alert(
"PDF OCR साठी PDF मधील page चा screenshot/photo upload करा."
);

return;

}

runOCR(file);

}

};

input.click();

}


/* =====================================================
   OCR
===================================================== */

async function runOCR(file){

let status=document
.getElementById("ocrStatus");

let results=document
.getElementById("ocrResults");


status.innerHTML=`

<div class="scanbox loading">

📷 <b>OCR Scan सुरू आहे...</b>

<br><br>

Photo/document मधील text वाचत आहे.

<br>

कृपया page बंद करू नका.

</div>

`;

results.innerHTML="";


try{

const result=await Tesseract.recognize(

file,
"eng",

{

logger:function(info){

if(info.status==="recognizing text"){

let percent=Math.round(
(info.progress || 0)*100
);

status.innerHTML=`

<div class="scanbox">

🔍 OCR Reading...
<br>
<b>${percent}%</b>

</div>

`;

}

}

}

);


let rawText=result.data.text || "";

status.innerHTML=`

<div class="result">

✅ <b>OCR Complete</b>

<br>

Text successfully read.

</div>

`;


/* PARSE DATA */

let records=parseCustomerData(rawText);


/* SHOW RAW TEXT */

results.innerHTML=`

<div class="card">

<h3>📄 OCR Result</h3>

<textarea
id="rawOCR"
>${safe(rawText)}</textarea>

<button onclick="parseAgain()">
🔄 Re-Read Details
</button>

</div>

`;


/* SHOW DETECTED CUSTOMERS */

renderOCRRecords(records);


}catch(error){

console.log(error);

status.innerHTML=`

<div class="result">

❌ OCR Scan Failed.

<br><br>

Photo clear करून पुन्हा try करा.

</div>

`;

}

}


/* =====================================================
   PARSE CUSTOMER DATA
===================================================== */

function parseCustomerData(text){

let lines=text
.split(/\r?\n/)
.map(x=>x.trim())
.filter(x=>x.length>1);


/* remove duplicate lines */

lines=[...new Set(lines)];


/* detect mobile */

let mobiles=
text.match(
/(?:\+91[\s-]?)?[6-9]\d{9}/g
) || [];


/* detect vehicle */

let vehicleMatches=
text
.toUpperCase()
.match(
/[A-Z]{2}[\s-]?[0-9]{1,2}[\s-]?[A-Z]{1,3}[\s-]?[0-9]{3,4}/g
) || [];


/* detect money */

let amounts=
text.match(
/(?:₹|RS\.?|INR)?\s?[\d,]+(?:\.\d{1,2})?/gi
) || [];


/* clean */

mobiles=mobiles.map(x=>
x.replace(/\D/g,"").slice(-10)
);

vehicleMatches=vehicleMatches.map(x=>
normalizeVehicle(x)
);

amounts=amounts
.map(x=>
x.replace(/[^\d.]/g,"")
)
.filter(x=>x);


/* try row-wise detection */

let records=[];


/*
If vehicle numbers exist,
create one customer record for
each detected vehicle.
*/

if(vehicleMatches.length){

vehicleMatches.forEach((vehicle,index)=>{

let mobile=mobiles[index] || "";

let amount=amounts[index] || "";


/*
Find nearby line as possible name
*/

let name="";

let vehicleIndex=lines.findIndex(
line=>
normalizeVehicle(line)
.includes(vehicle)
);


if(vehicleIndex>0){

let previous=lines[vehicleIndex-1];

if(
previous &&
!/\d{6,}/.test(previous) &&
previous.length<80
){

name=cleanName(previous);

}

}


/*
If name not found,
look at first useful lines.
*/

if(!name){

let candidates=lines.filter(line=>{

return(
line.length>=3 &&
line.length<=60 &&
!/\d{6,}/.test(line) &&
!/vehicle|mobile|phone|amount|pending|customer|name/i.test(line)
);

});

name=candidates[index] || "";

}


records.push({

name:name,

vehicle:vehicle,

mobile:mobile,

pending:amount,

dueDate:"",

agreement:"",

address:"",

status:"Pending"

});

});

}


/*
If no vehicle detected,
try to create one record from
available text.
*/

if(!records.length){

let name="";

let possibleName=lines.find(line=>{

return(
line.length>=3 &&
line.length<=60 &&
!/^\d+$/.test(line) &&
!/vehicle|mobile|phone|amount|pending|customer|name/i.test(line)
);

});

name=possibleName || "";

records.push({

name:name,

vehicle:vehicleMatches[0] || "",

mobile:mobiles[0] || "",

pending:amounts[0] || "",

dueDate:"",

agreement:"",

address:"",

status:"Pending"

});

}

return records;

}


/* =====================================================
   CLEAN NAME
===================================================== */

function cleanName(text){

return text
.replace(
/(customer|name|vehicle|mobile|phone|amount|pending)\s*[:\-]/ig,
""
)
.trim();

}


/* =====================================================
   RENDER OCR RECORDS
===================================================== */

function renderOCRRecords(records){

let box=document.getElementById("ocrResults");

box.innerHTML+=`

<div class="card">

<h3>👥 Detected Customer Details</h3>

<div class="small">

OCR ने खाली किंवा चुकीची माहिती ओळखली असेल तर
Save करण्यापूर्वी ती edit करा.

</div>

</div>

`;


records.forEach((r,index)=>{

box.innerHTML+=`

<div class="customer-edit">

<h4>
Customer ${index+1}
</h4>

<label>Customer Name</label>

<input
id="ocrName${index}"
value="${safe(r.name)}"
>

<label>Vehicle Number</label>

<input
id="ocrVehicle${index}"
value="${safe(r.vehicle)}"
>

<label>Mobile Number</label>

<input
id="ocrMobile${index}"
value="${safe(r.mobile)}"
>

<label>Pending Amount</label>

<input
id="ocrPending${index}"
type="number"
value="${safe(r.pending)}"
>

<label>Due Date</label>

<input
id="ocrDue${index}"
type="date"
value="${safe(r.dueDate)}"
>

<label>Agreement / Loan Number</label>

<input
id="ocrAgreement${index}"
value="${safe(r.agreement)}"
>

<label>Address</label>

<textarea
id="ocrAddress${index}"
>${safe(r.address)}</textarea>

<label>Status</label>

<select id="ocrStatus${index}">

<option value="Pending">Pending</option>
<option value="Promise">Payment Promise</option>
<option value="Paid">Paid</option>
<option value="Vehicle">Vehicle Handover</option>

</select>

<button
class="green"
onclick="saveOCRCustomer(${index})"
>
✅ Save This Customer
</button>

</div>

`;

});

}


/* =====================================================
   SAVE OCR CUSTOMER
===================================================== */

function saveOCRCustomer(index){

let customer={

name:document.getElementById(
"ocrName"+index
).value.trim(),

vehicle:normalizeVehicle(
document.getElementById(
"ocrVehicle"+index
).value
),

mobile:document.getElementById(
"ocrMobile"+index
).value.trim(),

pending:document.getElementById(
"ocrPending"+index
).value.trim(),

dueDate:document.getElementById(
"ocrDue"+index
).value,

agreement:document.getElementById(
"ocrAgreement"+index
).value.trim(),

address:document.getElementById(
"ocrAddress"+index
).value.trim(),

status:document.getElementById(
"ocrStatus"+index
).value

};


if(!customer.name && !customer.vehicle){

alert(
"Customer Name किंवा Vehicle Number आवश्यक आहे."
);

return;

}


/* DUPLICATE */

let duplicate=customers.find(c=>{

return(
customer.vehicle &&
normalizeVehicle(c.vehicle)===customer.vehicle
);

});


if(duplicate){

if(
confirm(
"⚠️ हा vehicle आधीच list मध्ये आहे.\n\nExisting customer update करायचा का?"
)
){

Object.assign(
duplicate,
customer
);

saveData();
displayCustomers();

alert("✅ Existing customer updated.");

return;

}

return;

}


/* SAVE */

customers.push(customer);

saveData();

displayCustomers();

alert(
"✅ Customer successfully saved."
);

}


/* =====================================================
   ADD CUSTOMER
===================================================== */

function addCustomer(){

let name=document
.getElementById("customerName")
.value.trim();

let vehicle=normalizeVehicle(
document.getElementById("vehicleNumber")
.value
);

let mobile=document
.getElementById("mobile")
.value.trim();

let pending=document
.getElementById("pending")
.value;

let dueDate=document
.getElementById("dueDate")
.value;

let agreement=document
.getElementById("agreement")
.value.trim();

let address=document
.getElementById("address")
.value.trim();

let status=document
.getElementById("status")
.value;


if(!name && !vehicle){

alert(
"Customer name किंवा vehicle number टाका."
);

return;

}


let already=customers.find(
c=>
vehicle &&
normalizeVehicle(c.vehicle)===vehicle
);


if(already){

alert(
"⚠️ हे vehicle आधीच list मध्ये आहे."
);

return;

}


customers.push({

name:name,
vehicle:vehicle,
mobile:mobile,
pending:pending,
dueDate:dueDate,
agreement:agreement,
address:address,
status:status

});


saveData();

alert(
"✅ Customer successfully saved."
);


[
"customerName",
"vehicleNumber",
"mobile",
"pending",
"dueDate",
"agreement",
"address"
].forEach(id=>{
document.getElementById(id).value="";
});


displayCustomers();

}


/* =====================================================
   DISPLAY CUSTOMER LIST
===================================================== */

function displayCustomers(){

let box=document
.getElementById("customerList");


if(!customers.length){

box.innerHTML=
"No customers added.";

return;

}


box.innerHTML=customers
.map((c,i)=>`

<div class="result">

<b>
${i+1}. ${safe(c.name || "-")}
</b>

<br>🚗 Vehicle:
${safe(c.vehicle || "-")}

<br>📱 Mobile:
${safe(c.mobile || "-")}

<br>💰 Pending:
₹${safe(c.pending || "0")}

<br>📅 Due:
${safe(c.dueDate || "-")}

<br>📄 Agreement:
${safe(c.agreement || "-")}

<br>📌 Status:
${safe(c.status || "-")}

<br><br>

<button
class="green"
onclick="paymentFor('${encodeURIComponent(c.name || "")}')"
>
💰 Payment
</button>

<button
onclick="editCustomer(${i})"
>
✏️ Edit
</button>

<button
class="red"
onclick="deleteCustomer(${i})"
>
Delete
</button>

</div>

`).join("");

}


/* =====================================================
   EDIT CUSTOMER
===================================================== */

function editCustomer(index){

let c=customers[index];

document.getElementById("customerName").value=c.name || "";
document.getElementById("vehicleNumber").value=c.vehicle || "";
document.getElementById("mobile").value=c.mobile || "";
document.getElementById("pending").value=c.pending || "";
document.getElementById("dueDate").value=c.dueDate || "";
document.getElementById("agreement").value=c.agreement || "";
document.getElementById("address").value=c.address || "";
document.getElementById("status").value=c.status || "Pending";

document.getElementById("customerName")
.scrollIntoView({behavior:"smooth"});

alert(
"Customer details वर edit करून Save Customer करा."
);

}


/* =====================================================
   PAYMENT
===================================================== */

function paymentFor(name){

name=decodeURIComponent(name);

document.getElementById(
"paymentCustomer"
).value=name;

document.getElementById(
"paymentCustomer"
).scrollIntoView({
behavior:"smooth"
});

}


/* =====================================================
   SAVE PAYMENT
===================================================== */

function savePayment(){

let name=document
.getElementById("paymentCustomer")
.value.trim();

let amount=document
.getElementById("paymentAmount")
.value;

let date=document
.getElementById("paymentDate")
.value;


if(!name || !amount){

alert(
"Customer आणि payment amount टाका."
);

return;

}


let customer=customers.find(
c=>
(c.name || "").toLowerCase()
===name.toLowerCase()
);


if(customer){

let old=parseFloat(
customer.pending
)||0;

let paid=parseFloat(
amount
)||0;

customer.pending=Math.max(
0,
old-paid
);

if(customer.pending===0){

customer.status="Paid";

}

saveData();

displayCustomers();

}


document.getElementById(
"paymentMessage"
).innerHTML=`

<div class="result">

✅ <b>Payment Saved</b>

<br>
Customer: ${safe(name)}

<br>
Amount: ₹${safe(amount)}

<br>
Date: ${safe(date || "Today")}

</div>

`;


document.getElementById(
"paymentAmount"
).value="";

}


/* =====================================================
   DELETE
===================================================== */

function deleteCustomer(index){

if(
confirm(
"हा customer delete करायचा आहे का?"
)
){

customers.splice(index,1);

saveData();

displayCustomers();

}

}


/* =====================================================
   USE VEHICLE
===================================================== */

function useVehicle(vehicle){

vehicle=decodeURIComponent(vehicle);

document.getElementById(
"vehicleNumber"
).value=vehicle.toUpperCase();

document.getElementById(
"vehicleNumber"
).scrollIntoView({
behavior:"smooth"
});

}


/* =====================================================
   PARSE AGAIN
===================================================== */

function parseAgain(){

let text=document
.getElementById("rawOCR")
