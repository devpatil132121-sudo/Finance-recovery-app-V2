<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dev Finance Collection</title>

<!-- OCR LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f5f9;
  color:#222;
}

header{
  background:#123b68;
  color:white;
  padding:18px;
  text-align:center;
}

header h2{
  margin:0 0 5px;
}

.container{
  padding:15px;
  max-width:650px;
  margin:auto;
}

.card{
  background:white;
  padding:16px;
  margin:12px 0;
  border-radius:14px;
  box-shadow:0 3px 10px #0001;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 16px;
  margin:5px 2px;
  font-size:15px;
  cursor:pointer;
  background:#123b68;
  color:white;
}

button.green{
  background:#198754;
}

button.orange{
  background:#f08c00;
}

button.red{
  background:#dc3545;
}

input,select{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:15px;
}

.option{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.result{
  padding:12px;
  background:#eef5ff;
  border-radius:10px;
  margin-top:10px;
  line-height:1.6;
}

.small{
  font-size:13px;
  color:#666;
}

hr{
  border:0;
  border-top:1px solid #ddd;
  margin:15px 0;
}

</style>
</head>


<body>


<header>

<h2>DEV FINANCE COLLECTION</h2>

<div>
Customer & Vehicle Management
</div>

</header>



<div class="container">


<!-- =========================
     SEARCH
========================= -->

<div class="card">

<h3>🔎 Smart Customer / Vehicle Search</h3>

<input
id="searchBox"
placeholder="Customer name किंवा Vehicle number"
oninput="searchCustomer()"
>


<div class="option">

<button onclick="startCamera()">
📷 Camera Scan
</button>


<button onclick="scanFromGallery()">
🖼️ Gallery Scan
</button>

</div>


<div id="searchResult"></div>

</div>



<!-- =========================
     ADD CUSTOMER
========================= -->

<div class="card">

<h3>➕ Add Customer / Vehicle</h3>


<input
id="customerName"
placeholder="Customer Name"
>


<input
id="vehicleNumber"
placeholder="Vehicle Number"
>


<input
id="mobile"
placeholder="Mobile Number"
type="tel"
>


<input
id="pending"
placeholder="Pending Amount"
type="number"
>


<select id="status">

<option value="Pending">
Pending
</option>

<option value="Promise">
Payment Promise
</option>

<option value="Paid">
Paid
</option>

<option value="Vehicle">
Vehicle Handover
</option>

</select>


<button
class="green"
onclick="addCustomer()"
>

Save Customer

</button>

</div>



<!-- =========================
     PAYMENT
========================= -->

<div class="card">

<h3>💰 Collection Entry</h3>


<input
id="paymentCustomer"
placeholder="Customer Name"
>


<input
id="paymentAmount"
placeholder="Payment Amount"
type="number"
>


<input
id="paymentDate"
type="date"
>


<button
class="green"
onclick="savePayment()"
>

Save Payment

</button>


<div id="paymentMessage"></div>

</div>



<!-- =========================
     CUSTOMER LIST
========================= -->

<div class="card">

<h3>📋 Customer List</h3>

<div id="customerList"></div>

</div>


</div>



<script>


/* =====================================================
   DATA
===================================================== */

let customers =
JSON.parse(
localStorage.getItem("devCustomers")
) || [];


/* =====================================================
   SAVE DATA
===================================================== */

function saveData(){

localStorage.setItem(
"devCustomers",
JSON.stringify(customers)
);

}



/* =====================================================
   NORMALIZE VEHICLE NUMBER
===================================================== */

function normalizeVehicle(text){

return (text || "")
.toUpperCase()
.replace(/[^A-Z0-9]/g,"");

}



/* =====================================================
   VEHICLE SIMILARITY
===================================================== */

function vehicleSimilarity(a,b){

a = normalizeVehicle(a);
b = normalizeVehicle(b);

if(!a || !b){
return 0;
}

let maxLen =
Math.max(a.length,b.length);

let same = 0;

let minLen =
Math.min(a.length,b.length);


for(
let i=0;
i<minLen;
i++
){

if(a[i] === b[i]){
same++;
}

}


return Math.round(
(same/maxLen)*100
);

}



/* =====================================================
   SMART SEARCH
===================================================== */

function searchCustomer(){

let q =
document.getElementById(
"searchBox"
).value.trim();


let box =
document.getElementById(
"searchResult"
);


if(!q){

box.innerHTML="";
return;

}


let query =
normalizeVehicle(q);


/* EXACT CUSTOMER / VEHICLE MATCH */

let exact =
customers.filter(c =>

(c.name || "")
.toLowerCase()
.includes(
q.toLowerCase()
)

||

normalizeVehicle(
c.vehicle
).includes(
query
)

);


if(exact.length){

box.innerHTML =
exact.map(c => `

<div class="result">

<b>👤 ${c.name || "-"}</b>

<br>

🚗 Vehicle:
${c.vehicle || "-"}

<br>

📱 Mobile:
${c.mobile || "-"}

<br>

💰 Pending:
₹${c.pending || "0"}

<br>

📌 Status:
${c.status || "-"}

</div>

`).join("");

return;

}



/* =====================================================
   SMART VEHICLE MATCH
===================================================== */

let smart =
customers

.map(c => ({

customer:c,

score:
vehicleSimilarity(
query,
c.vehicle
)

}))

.filter(
x => x.score >= 60
)

.sort(
(a,b) =>
b.score-a.score
)

.slice(0,5);



if(smart.length){

box.innerHTML = `

<div class="result">

🔎 <b>Smart Match</b>

<br>

Exact match सापडला नाही.

<br>

जवळचे vehicle matches:

</div>

`;


smart.forEach(x => {

box.innerHTML += `

<div class="result">

<b>
🚗 ${x.customer.vehicle || "-"}
</b>

<br>

👤
${x.customer.name || "-"}

<br>

📱
${x.customer.mobile || "-"}

<br>

💰 Pending:
₹${x.customer.pending || "0"}

<br>

📊 Match:
${x.score}%

<br>

<button
onclick="selectCustomer('${x.customer.vehicle}')"
>

Select Customer

</button>

</div>

`;

});


return;

}



/* =====================================================
   NO MATCH
===================================================== */

box.innerHTML = `

<div class="result">

❌ Customer / Vehicle सापडला नाही.

<br><br>

<button
onclick="useVehicle('${q}')"
>

➕ New Customer Add करा

</button>

</div>

`;

}



/* =====================================================
   SELECT SMART MATCH
===================================================== */

function selectCustomer(vehicle){

let c =
customers.find(
x => x.vehicle === vehicle
);


if(!c){
return;
}


document.getElementById(
"searchBox"
).value =
c.vehicle;


document.getElementById(
"searchResult"
).innerHTML = `

<div class="result">

<b>
✅ Customer Found
</b>

<hr>

👤 Customer:
${c.name || "-"}

<br>

🚗 Vehicle:
${c.vehicle || "-"}

<br>

📱 Mobile:
${c.mobile || "-"}

<br>

💰 Pending:
₹${c.pending || "0"}

<br>

📌 Status:
${c.status || "-"}

<br><br>

<button
class="green"
onclick="paymentFor('${c.name}')"
>

💰 Add Payment

</button>

</div>

`;

}



/* =====================================================
   CAMERA SCAN
===================================================== */

function startCamera(){

let input =
document.createElement(
"input"
);


input.type = "file";

input.accept =
"image/*";

input.capture =
"environment";


input.onchange =
function(){

if(
input.files &&
input.files.length
){

runOCR(
input.files[0]
);

}

};


input.click();

}



/* =====================================================
   GALLERY SCAN
===================================================== */

function scanFromGallery(){

let input =
document.createElement(
"input"
);


input.type = "file";

input.accept =
"image/*";


input.onchange =
function(){

if(
input.files &&
input.files.length
){

runOCR(
input.files[0]
);

}

};


input.click();

}



/* =====================================================
   OCR SCAN
===================================================== */

async function runOCR(file){

let box =
document.getElementById(
"searchResult"
);


box.innerHTML = `

<div class="result">

📷 <b>Vehicle Scan सुरू आहे...</b>

<br><br>

OCR photo मधील text वाचत आहे.

<br>

कृपया थोडा वेळ थांबा.

</div>

`;


try{


const result =
await Tesseract.recognize(

file,

"eng",

{

logger:function(info){

if(
info.status ===
"recognizing text"
){

let percent =
Math.round(
(info.progress || 0)
*100
);


box.innerHTML = `

<div class="result">

📷 Vehicle Scan

<br>

🔍 OCR Progress:
${percent}%

</div>

`;

}

}

}

);



let rawText =
result.data.text || "";


let cleaned =
normalizeVehicle(
rawText
);


/* =================================================
   INDIAN VEHICLE NUMBER DETECTION
================================================= */

let matches =
cleaned.match(

/[A-Z]{2}[0-9]{1,2}[A-Z]{1,3}[0-9]{3,4}/g

);


let detected =
matches &&
matches.length
?
matches[0]
:
cleaned;



/* SEARCH OCR RESULT */

document.getElementById(
"searchBox"
).value =
detected;


searchCustomer();



/* =================================================
   IF OCR FAILED
================================================= */

if(!matches){

box.innerHTML += `

<div class="result">

⚠️ पूर्ण vehicle number
स्पष्टपणे वाचता आला नाही.

<br><br>

OCR ने वाचलेला text:

<br>

<b>
${rawText || "No text detected"}
</b>

<br><br>

नंबर search box मध्ये manually
correct करून search करू शकता.

</div>

`;

}


}catch(error){


console.log(error);


box.innerHTML = `

<div class="result">

❌ OCR Scan Failed.

<br><br>

Vehicle number plate चा
clear आणि जवळून photo घेऊन
पुन्हा try करा.

</div>

`;

}

}



/* =====================================================
   ADD CUSTOMER
===================================================== */

function addCustomer(){

let name =
document.getElementById(
"customerName"
).value.trim();


let vehicle =
normalizeVehicle(

document.getElementById(
"vehicleNumber"
).value

);


let mobile =
document.getElementById(
"mobile"
).value.trim();


let pending =
document.getElementById(
"pending"
).value;


let status =
document.getElementById(
"status"
).value;



if(
!name &&
!vehicle
){

alert(
"Customer name किंवा vehicle number टाका."
);

return;

}



/* DUPLICATE CHECK */

let already =
customers.find(
c =>
normalizeVehicle(c.vehicle)
=== vehicle &&
vehicle !== ""
);


if(already){

alert(
"⚠️ हे vehicle आधीच list मध्ये आहे."
);

return;

}



customers.push({

name:name,

vehicle:vehicle,

mobile:mobile,

pending:pending,

status:status

});


saveData();


alert(
"✅ Customer successfully saved."
);



document.getElementById(
"customerName"
).value="";


document.getElementById(
"vehicleNumber"
).value="";


document.getElementById(
"mobile"
).value="";


document.getElementById(
"pending"
).value="";


displayCustomers();

}



/* =====================================================
   DISPLAY CUSTOMER LIST
===================================================== */

function displayCustomers(){

let box =
document.getElementById(
"customerList"
);


if(!customers.length){

box.innerHTML =
"No customers added.";

return;

}



box.innerHTML =
customers.map(
(c,i)=>`

<div class="result">

<b>
${i+1}.
${c.name || "-"}
</b>

<br>

🚗 Vehicle:
${c.vehicle || "-"}

<br>

📱 Mobile:
${c.mobile || "-"}

<br>

💰 Pending:
₹${c.pending || "0"}

<br>

📌 Status:
${c.status || "-"}

<br><br>

<button
class="green"
onclick="paymentFor('${c.name}')"
>

💰 Payment

</button>


<button
class="red"
onclick="deleteCustomer(${i})"
>

Delete

</button>

</div>

`
).join("");

}



/* =====================================================
   PAYMENT
===================================================== */

function paymentFor(name){

document.getElementById(
"paymentCustomer"
).value =
name;


document.getElementById(
"paymentCustomer"
).scrollIntoView({

behavior:"smooth"

});

}



/* =====================================================
   SAVE PAYMENT
===================================================== */

function savePayment(){

let name =
document.getElementById(
"paymentCustomer"
).value.trim();


let amount =
document.getElementById(
"paymentAmount"
).value;


let date =
document.getElementById(
"paymentDate"
).value;



if(
!name ||
!amount
){

alert(
"Customer आणि payment amount टाका."
);

return;

}



let customer =
customers.find(

c =>
(c.name || "")
.toLowerCase()
=== name.toLowerCase()

);



if(customer){

let old =
parseFloat(
customer.pending
) || 0;


let paid =
parseFloat(
amount
) || 0;


customer.pending =
Math.max(
0,
old-paid
);


if(
customer.pending === 0
){

customer.status =
"Paid";

}


saveData();

displayCustomers();

}



document.getElementById(
"paymentMessage"
).innerHTML = `

<div class="result">

✅ <b>Payment Saved</b>

<br>

Customer:
${name}

<br>

Amount:
₹${amount}

<br>

Date:
${date || "Today"}

</div>

`;


document.getElementById(
"paymentAmount"
).value="";

}



/* =====================================================
   DELETE CUSTOMER
===================================================== */

function deleteCustomer(index){

if(
confirm(
"हा customer delete करायचा आहे का?"
)
){

customers.splice(
index,
1
);


saveData();

displayCustomers();

}

}



/* =====================================================
   USE OCR / SEARCHED VEHICLE
===================================================== */

function useVehicle(vehicle){

document.getElementById(
"vehicleNumber"
).value =
vehicle.toUpperCase();


document.getElementById(
"vehicleNumber"
).scrollIntoView({

behavior:"smooth"

});

}



/* =====================================================
   DOCUMENT
===================================================== */

function documentSelected(){

let file =
document.getElementById(
"documentFile"
).files[0];


if(file){

alert(
"📄 Document selected: "
+
file.name
);

}

}



/* =====================================================
   START APP
===================================================== */

displayCustomers();


</script>

</body>
</html>
