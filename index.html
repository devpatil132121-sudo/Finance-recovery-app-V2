<script>

/* ================================
   DATABASE
================================ */

let customers =
JSON.parse(
localStorage.getItem("devCustomers")
) || [];


/* ================================
   SAVE DATABASE
================================ */

function saveData(){

localStorage.setItem(
"devCustomers",
JSON.stringify(customers)
);

}


/* ================================
   SAFE TEXT
================================ */

function safe(text){

return String(text || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ================================
   VEHICLE NORMALIZE
================================ */

function normalizeVehicle(text){

return (text || "")
.toUpperCase()
.replace(/[^A-Z0-9]/g,"");

}


/* ================================
   VEHICLE SIMILARITY
================================ */

function vehicleSimilarity(a,b){

a=normalizeVehicle(a);
b=normalizeVehicle(b);

if(!a || !b) return 0;

let maxLen=Math.max(a.length,b.length);
let minLen=Math.min(a.length,b.length);

let same=0;

for(let i=0;i<minLen;i++){

if(a[i]===b[i]){
same++;
}

}

return Math.round((same/maxLen)*100);

}


/* ================================
   SEARCH
================================ */

function searchCustomer(){

let q=document
.getElementById("searchBox")
.value
.trim();

let box=document
.getElementById("searchResult");

if(!q){

box.innerHTML="";
return;

}

let lower=q.toLowerCase();
let vehicle=normalizeVehicle(q);

let exact=customers.filter(c=>{

return (

(c.name || "")
.toLowerCase()
.includes(lower)

||

normalizeVehicle(c.vehicle)
.includes(vehicle)

||

(c.mobile || "")
.includes(q)

||

(c.agreement || "")
.toLowerCase()
.includes(lower)

);

});


if(exact.length){

box.innerHTML=exact.map(c=>`

<div class="result">

<b>👤 ${safe(c.name || "-")}</b>

<br>
🚗 Vehicle:
${safe(c.vehicle || "-")}

<br>
📱 Mobile:
${safe(c.mobile || "-")}

<br>
💰 Pending:
₹${safe(c.pending || "0")}

<br>
📅 Due:
${safe(c.dueDate || "-")}

<br>
📄 Agreement:
${safe(c.agreement || "-")}

<br>
📌 Status:
${safe(c.status || "-")}

<br><br>

<button
class="green"
onclick="paymentFor('${encodeURIComponent(c.name || "")}')"
>
💰 Payment
</button>

</div>

`).join("");

return;

}


/* ================================
   SMART VEHICLE MATCH
================================ */

let smart=customers
.map(c=>({

customer:c,

score:
vehicleSimilarity(
vehicle,
c.vehicle
)

}))
.filter(x=>x.score>=60)
.sort((a,b)=>b.score-a.score)
.slice(0,5);


if(smart.length){

box.innerHTML=`

<div class="result">

🔎 <b>Smart Match</b>

<br>
Exact match सापडला नाही.

</div>

`;

smart.forEach(x=>{

box.innerHTML+=`

<div class="result">

🚗 <b>
${safe(x.customer.vehicle || "-")}
</b>

<br>
👤 ${safe(x.customer.name || "-")}

<br>
📱 ${safe(x.customer.mobile || "-")}

<br>
💰 ₹${safe(x.customer.pending || "0")}

<br>
📊 Match:
${x.score}%

<br>

<button
onclick="selectCustomer('${encodeURIComponent(x.customer.vehicle || "")}')"
>
Select Customer
</button>

</div>

`;

});

return;

}


box.innerHTML=`

<div class="result">

❌ Customer / Vehicle सापडला नाही.

<br><br>

<button
onclick="useVehicle('${encodeURIComponent(q)}')"
>
➕ New Customer Add करा
</button>

</div>

`;

}


/* ================================
   SELECT CUSTOMER
================================ */

function selectCustomer(vehicle){

vehicle=decodeURIComponent(vehicle);

let c=customers.find(
x=>x.vehicle===vehicle
);

if(!c) return;

document.getElementById(

).value=c.vehicle;

).innerHTML=`

<hr>

👤 Customer:
${safe(c.name || "-")}

<br>
🚗 Vehicle:
${safe(c.vehicle || "-")}

<br>
📱 Mobile:
${safe(c.mobile || "-")}

<br>
💰 Pending:
₹${safe(c.pending || "0")}

<br>
📅 Due:
${safe(c.dueDate || "-")}

<br>
📄 Agreement:
${safe(c.agreement || "-")}

<br>
📌 Status:
${safe(c.status || "-")}

<br><br>

class="green"

/* ================================
   CAMERA
================================ */

function startCamera(){

let input=document.createElement("input");

input.type="file";
input.accept="image/*";
input.capture="environment";

input.onchange=function(){

if(input.files && input.files.length){

runOCR(input.files[0]);

}

};

input.click();

}


/* ================================
   GALLERY
================================ */

function scanFromGallery(){

let input=document.createElement("input");

input.type="file";
input.accept="image/*";

input.onchange=function(){

if(input.files && input.files.length){

runOCR(input.files[0]);

}

};

input.click();

}


/* ================================
   DOCUMENT
================================ */

function scanDocument(){

let input=document.createElement("input");

input.type="file";

input.accept="image/*,.txt,.csv";

input.onchange=function(){

if(input.files && input.files.length){

runOCR(input.files[0]);

}

};

input.click();

}


/* ================================
   IMAGE ENHANCEMENT
================================ */

function enhanceImage(file){

return new Promise((resolve,reject)=>{

let img=new Image();

let url=URL.createObjectURL(file);

img.onload=function(){

let canvas=document.createElement("canvas");

let scale=2;

canvas.width=img.width*scale;
canvas.height=img.height*scale;

let ctx=canvas.getContext("2d");

ctx.imageSmoothingEnabled=true;

ctx.drawImage(
img,
0,
0,
canvas.width,
canvas.height
);

let imageData=ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);

let data=imageData.data;

for(let i=0;i<data.length;i+=4){

let gray=
0.299*data[i]+
0.587*data[i+1]+
0.114*data[i+2];

gray=gray*1.15;

if(gray>255) gray=255;

data[i]=gray;
data[i+1]=gray;
data[i+2]=gray;

}

ctx.putImageData(
imageData,
0,
0
);

canvas.toBlob(
blob=>{
resolve(blob);
},
"image/jpeg",
0.95
);

URL.revokeObjectURL(url);

};

img.onerror=reject;

img.src=url;

});

}


/* ================================
   OCR
================================ */

async function runOCR(file){

let status=document
.getElementById("ocrStatus");

let results=document
.getElementById("ocrResults");

status.innerHTML=`

<div class="scanbox loading">

📷 <b>Photo Enhance होत आहे...</b>

<br><br>

नंतर OCR scan सुरू होईल.

</div>

`;

results.innerHTML="";

try{

let enhanced=await enhanceImage(file);

status.innerHTML=`

<div class="scanbox">

🔍 <b>OCR Scan सुरू आहे...</b>

<br><br>

Text वाचत आहे. कृपया थांबा.

</div>

`;

const result=await Tesseract.recognize(

enhanced,

"eng",

{

logger:function(info){

if(info.status==="recognizing text"){

let percent=Math.round(
(info.progress || 0)*100
);

status.innerHTML=`

<div class="scanbox">

🔍 OCR Progress:
<b>${percent}%</b>

</div>

`;

}

}

}

);

let rawText=result.data.text || "";

status.innerHTML=`

<div class="result">

✅ <b>OCR Complete</b>

<br>
Text वाचला आहे.

</div>

`;

let records=parseCustomerData(rawText);

results.innerHTML=`

<div class="card">

<h3>📄 OCR Text</h3>

<textarea
id="rawOCR"
>${safe(rawText)}</textarea>

<button onclick="parseAgain()">
🔄 Details पुन्हा ओळखा
</button>

</div>

`;

renderOCRRecords(records);

}catch(error){

console.log(error);

status.innerHTML=`

<div class="result">

❌ OCR Scan Failed.

<br><br>

कृपया clear आणि जवळचा फोटो वापरा.

</div>

`;

}

}


/* ================================
   PARSE CUSTOMER DATA
================================ */

function parseCustomerData(text){

let lines=text
.split(/\r?\n/)
.map(x=>x.trim())
.filter(x=>x.length>1);

lines=[...new Set(lines)];


/* MOBILE */

let mobiles=text.match(
/(?:\+91[\s-]?)?[6-9]\d{9}/g
) || [];

mobiles=mobiles.map(x=>
x.replace(/\D/g,"").slice(-10)
);


/* VEHICLE */

let vehicles=text
.toUpperCase()
.match(
/[A-Z]{2}[\s-]?[0-9]{1,2}[\s-]?[A-Z]{1,3}[\s-]?[0-9]{3,4}/g
) || [];

vehicles=vehicles.map(
x=>normalizeVehicle(x)
);


/* AMOUNT */

let amounts=text.match(
/(?:₹|RS\.?|INR)?\s?[\d,]+(?:\.\d{1,2})?/gi
) || [];

amounts=amounts
.map(x=>x.replace(/[^\d.]/g,""))
.filter(x=>x);


/* RECORDS */

let records=[];


if(vehicles.length){

vehicles.forEach((vehicle,index)=>{

let name="";
let mobile=mobiles[index] || "";
let amount=amounts[index] || "";


/* Look for name near vehicle */

let vi=lines.findIndex(
line=>
normalizeVehicle(line).includes(vehicle)
);


if(vi>0){

let previous=lines[vi-1];

if(
previous &&
previous.length<=80 &&
!/\d{6,}/.test(previous)
){

name=cleanName(previous);

}

}


/* Fallback */

if(!name){

let possible=lines.filter(line=>{

return(
line.length>=3 &&
line.length<=60 &&
!/\d{6,}/.test(line) &&
!/vehicle|mobile|phone|amount|pending|customer|name/i.test(line)
);

});

name=possible[index] || "";

}


records.push({

name:name,
vehicle:vehicle,
mobile:mobile,
pending:amount,
dueDate:"",
agreement:"",
address:"",
status:"Pending"

});

});

}


/* No vehicle */

if(!records.length){

records.push({

name:"",
vehicle:"",
mobile:mobiles[0] || "",
pending:amounts[0] || "",
dueDate:"",
agreement:"",
address:"",
status:"Pending"

});

}

return records;

}


/* ================================
   CLEAN NAME
================================ */

function cleanName(text){

return text
.replace(
/(customer|name|vehicle|mobile|phone|amount|pending)\s*[:\-]/ig,
""
)
.trim();

}


/* ================================
   OCR RECORDS
================================ */

function renderOCRRecords(records){

let box=document
.getElementById("ocrResults");

box.innerHTML+=`

<div class="card">

<h3>👥 Detected Customer Details</h3>

<div class="small">

⚠️ Save करण्यापूर्वी प्रत्येक field तपासा.
चुकीचे OCR असल्यास manually correction करा.

</div>

</div>

`;


records.forEach((r,index)=>{

box.innerHTML+=`

<div class="customer-edit">

<h4>
Customer ${index+1}
</h4>

<label>Customer Name</label>

<input
id="ocrName${index}"
value="${safe(r.name)}"
>

<label>Vehicle Number</label>

<input
id="ocrVehicle${index}"
value="${safe(r.vehicle)}"
>

<label>Mobile Number</label>

<input
id="ocrMobile${index}"
value="${safe(r.mobile)}"
>

<label>Pending Amount</label>

<input
id="ocrPending${index}"
type="number"
value="${safe(r.pending)}"
>

<label>Due Date</label>

<input
id="ocrDue${index}"
type="date"
value="${safe(r.dueDate)}"
>

<label>Agreement / Loan Number</label>

<input
id="ocrAgreement${index}"
value="${safe(r.agreement)}"
>

<label>Address</label>

<textarea
id="ocrAddress${index}"
>${safe(r.address)}</textarea>

<label>Status</label>

<select id="ocrStatus${index}">

<option value="Pending">Pending</option>
<option value="Promise">Payment Promise</option>
<option value="Paid">Paid</option>
<option value="Vehicle">Vehicle Handover</option>

</select>

<button
class="green"
onclick="saveOCRCustomer(${index})"
>
✅ Confirm & Save
</button>

</div>

`;

});

}


/* ================================
   SAVE OCR CUSTOMER
================================ */

function saveOCRCustomer(index){

let customer={

name:document.getElementById(
"ocrName"+index
).value.trim(),

vehicle:normalizeVehicle(
document.getElementById(
"ocrVehicle"+index
).value
),

mobile:document.getElementById(
"ocrMobile"+index
).value.trim(),

pending:document.getElementById(
"ocrPending"+index
).value.trim(),

dueDate:document.getElementById(
"ocrDue"+index
).value,

agreement:document.getElementById(
"ocrAgreement"+index
).value.trim(),

address:document.getElementById(
"ocrAddress"+index
).value.trim(),

status:document.getElementById(
"ocrStatus"+index
).value

};


if(!customer.name && !customer.vehicle){

alert(
"Customer Name किंवा Vehicle Number आवश्यक आहे."
);

return;

}


/* DUPLICATE */

let duplicate=customers.find(c=>
customer.vehicle &&
normalizeVehicle(c.vehicle)
===customer.vehicle
);


if(duplicate){

let update=confirm(
"⚠️ हा vehicle आधीच list मध्ये आहे.\n\nExisting customer update करायचा का?"
);

if(update){

Object.assign(
duplicate,
customer
);

saveData();
displayCustomers();

alert(
"✅ Existing customer updated."
);

return;

}

return;

}


/* SAVE */

customers.push(customer);

saveData();

displayCustomers();

alert(
"✅ Customer successfully saved."
);

}


/* ================================
   ADD CUSTOMER
================================ */

function addCustomer(){

let name=document
.getElementById("customerName")
.value.trim();

let vehicle=normalizeVehicle(
document.getElementById("vehicleNumber")
.value
);

let mobile=document
.getElementById("mobile")
.value.trim();

let pending=document
.getElementById("pending")
.value;

let dueDate=document
.getElementById("dueDate")
.value;

let agreement=document
.getElementById("agreement")
.value.trim();

let address=document
.getElementById("address")
.value.trim();

let status=document
.getElementById("status")
.value;


if(!name && !vehicle){

alert(
"Customer name किंवा vehicle number टाका."
);

return;

}


let duplicate=customers.find(c=>
vehicle &&
normalizeVehicle(c.vehicle)===vehicle
);


if(duplicate){

alert(
"⚠️ हे vehicle आधीच list मध्ये आहे."
);

return;

}


customers.push({

name:name,
vehicle:vehicle,
mobile:mobile,
pending:pending,
dueDate:dueDate,
agreement:agreement,
address:address,
status:status

});


saveData();

alert(
"✅ Customer successfully saved."
);


[
"customerName",
"vehicleNumber",
"mobile",
"pending",
"dueDate",
"agreement",
"address"
].forEach(id=>{
document.getElementById(id).value="";
});


displayCustomers();

}

<br>

${safe(c.dueDate || "-")}

<br>

${safe(c.agreement || "-")}

/* ================================
   PAYMENT
================================ */

function paymentFor(name){

name=decodeURIComponent(name);

document.getElementById(
"paymentCustomer"
).value=name;

document.getElementById(
"paymentCustomer"
).scrollIntoView({
behavior:"smooth"
});

}


/* ================================
   SAVE PAYMENT
================================ */

function savePayment(){

let name=document
.getElementById("paymentCustomer")
.value.trim();

let amount=document
.getElementById("paymentAmount")
.value;

let date=document
.getElementById("paymentDate")
.value;


if(!name || !amount){

alert(
"Customer आणि payment amount टाका."
);

return;

}


let customer=customers.find(c=>
(c.name || "")
.toLowerCase()
===name.toLowerCase()
);


if(!customer){

alert(
"Customer सापडला नाही."
);

return;

}


let old=parseFloat(
customer.pending
)||0;

let paid=parseFloat(
amount
)||0;

customer.pending=Math.max(
0,
old-paid
);


if(customer.pending===0){

customer.status="Paid";

}

saveData();

displayCustomers();


document.getElementById(
"paymentMessage"
).innerHTML=`

<div class="result">

✅ <b>Payment Saved</b>

<br>
Customer:
${safe(name)}

<br>
Amount:
₹${safe(amount)}

<br>
Date:
${safe(date || "Today")}

</div>

`;

document.getElementById(
"paymentAmount"
).value="";

}


/* ================================
   DELETE
================================ */

function deleteCustomer(index){

if(confirm(
"हा customer delete करायचा आहे का?"
)){

customers.splice(index,1);

saveData();

displayCustomers();

}

}


/* ================================
   USE VEHICLE
================================ */

function useVehicle(vehicle){

vehicle=decodeURIComponent(vehicle);

document.getElementById(
"vehicleNumber"
).value=vehicle.toUpperCase();

document.getElementById(
"vehicleNumber"
).scrollIntoView({
behavior:"smooth"
});

}


/* ================================
   PARSE AGAIN
================================ */

function parseAgain(){

let text=document
.getElementById("rawOCR")
.value;

if(!text){

alert(
"OCR text उपलब्ध नाही."
);

return;

}

let records=parseCustomerData(text);

document.getElementById(
"ocrResults"
).innerHTML="";

renderOCRRecords(records);

}


/* ================================
   START
================================ */

displayCustomers();

</script>
